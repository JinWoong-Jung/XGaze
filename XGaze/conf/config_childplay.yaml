# ==================================================================================================================== #
#                         FINETUNING OR ZERO-SHOT EVALUATION ON CHILDPLAY (multi-person)                               #
#         Set experiment.task to `test` for zero-shot eval, or `train+test` to finetune then test.                    #
# ==================================================================================================================== #


project:
    name: XGaze # name of the wandb project
    version: 1.0.0
    description: XGaze - learnable query-based Cross-Attention for Gaze Estimation
    root: /home/jinwoongjung/XGaze

# ------------------------------------------------------------------------------------------------------------------- #

experiment:
    name: xgaze-childplay(fine-tuning) # name of the wandb job
    group: null # name of the wandb group
    task: train+test # combination of {train, val, test} separated by '+' sign
    dataset: childplay
    path: ${hydra:runtime.cwd} # to retrieve logs and checkpoints

# ------------------------------------------------------------------------------------------------------------------- #

data:
    num_people: 1 # int or -1 to include all people
    image_size: 512
    heatmap_size: 64
    heatmap_sigma: 3
    return_head_mask: False
    num_workers: 4
    gf:
        root: /home/jinwoongjung/MTGS/data/gazefollow_extended
        root_heads: null
        num_train_samples: 108955
    childplay:
        root: /home/jinwoongjung/MTGS/data/ChildPlay
        num_train_samples: 99527
        max_people: 4 # max number of people (per frame) the model predicts a heatmap/gaze_vec/inout for
# ------------------------------------------------------------------------------------------------------------------- #

model:
    XGaze:
        patch_size: 16
        token_dim: 768
        image_size: ${data.image_size}
        gaze_vec_dim: 2
        decoder_depth: 2
        decoder_num_heads: 8
        image_encoder:
            type: dinov3 # mae, dinov3
            dinov3:
                model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
                local_dir: /home/jinwoongjung/XGaze/weights/dinov3-vitl16
                trust_remote_code: True
                use_cls_token: True
            mae:
                encoder_depth: 12
                encoder_num_heads: 12
                encoder_num_global_tokens: 1
                weights: /home/jinwoongjung/XGaze/weights/multimae-b_98_rgb+-depth-semseg_1600e_multivit-afff3f8c.pth
    lora: # low-rank adaptation of the frozen DINOv3 image encoder
        use: False
        r: 8 # rank of the low-rank residual
        alpha: 16 # residual is scaled by alpha / r
        dropout: 0.0 # dropout on the adapter input
        target_modules: [q_proj, v_proj] # attention: q_proj, k_proj, v_proj, o_proj; mlp: up_proj, down_proj
        last_n_layers: -1 # adapt only the last N blocks, or -1 for all of them
    pretraining:
        gaze_backbone: /home/jinwoongjung/XGaze/weights/gaze360_resnet18.pt
    weights: null # /!\ null (default), or path to a checkpoint (overrides pretraining weights)

# ------------------------------------------------------------------------------------------------------------------- #

loss:
    weight_heatmap: 100
    weight_angular: 3
    weight_inout: 1
    weight_ooc: 0 # out-of-cone penalty; 0 disables it. Calibrate before raising (see `log_ooc`).
    log_ooc: False # log the raw OOC term without weighting it into the loss, to pick `weight_ooc`
    ooc:
        theta_deg: 60.0 # cone aperture
        alpha: 30.0 # cone boundary sharpness, relative to the head-to-target distance
        normalize_alpha: True # scale alpha by 1/||g-h||; False reproduces the paper's fixed alpha
        tau: 1.0 # spatial-softmax temperature; raise if the softmax over logits is near one-hot
        min_gaze_dist: 0.05 # skip samples whose target is this close to the head center

# ------------------------------------------------------------------------------------------------------------------- #

optimizer:
    lr: 5e-6
    lr_inout: 1e-3
    weight_decay: 3e-3

# ------------------------------------------------------------------------------------------------------------------- #

scheduler:
    type: cosine_warmup # cosine_warmup (default), null (no scheduler)
    warmup_epochs: 0

# ------------------------------------------------------------------------------------------------------------------- #

train:
    seed: 10 # int or null for no seed
    matmul_precision: highest # highest (default), high, medium
    precision: bf16-mixed # 64 (double), 32 (full), 16 (16bit mixed), bf16-mixed (bfloat16 mixed). Defaults to 32.
    epochs: 10
    batch_size: 256
    accumulate_grad_batches: 1 # 1 (default, no accumulation)
    device: cuda
    resume: False
    resume_from: null
    checkpointing:
        monitor: "metric/val/dist" # "metric/val/dist" (default), "loss/val", etc.
        mode: "min" # "min" (default), "max"
    freeze:
        gaze_encoder: False
        image_tokenizer: False
        image_encoder: True
        gaze_decoder: False
    swa:
        use: False
        lr: 1e-5
        epoch_start: 17
        annealing_epochs: 3

# ------------------------------------------------------------------------------------------------------------------- #

val:
    checkpoint: null
    batch_size: 256
    device: ${train.device}

# ------------------------------------------------------------------------------------------------------------------- #

test:
    checkpoint: null
    batch_size: 256
    device: ${train.device}

# ------------------------------------------------------------------------------------------------------------------- #

wandb:
    log: True
    entity: skkai_social # /!\ null, or your wandb entity
    watch: null # /!\ null, gradients, parameters, all
    watch_freq: 500

# ------------------------------------------------------------------------------------------------------------------- #

hydra:
    run:
        dir: ./
    sweep:
        dir: ${hydra.run.dir}
        subdir: ${hydra.job.num}
    job:
        chdir: False
